services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: financial-ai-postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: financial_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: financial-ai-redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: financial-ai-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build: .
    container_name: financial-ai-worker
    command: ["python", "-m", "batch.worker"]
    env_file:
      - .env
    depends_on:
      - redis

volumes:
  pgdata: